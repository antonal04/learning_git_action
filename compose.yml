services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_db

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - learning-network

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10


  learning-service:
    build:
      context: .
      dockerfile: Dockerfile

    image: learning:1.0

    container_name: learning-service

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      - SPRING_PROFILES_ACTIVE=docker

    ports:
      - "8080:8080"

    networks:
      - learning-network


volumes:
  mysql-data:


networks:
  learning-network:
    external: true