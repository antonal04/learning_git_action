name: matrix-build.yml
on:
  push:
    branches:
      - login-feature
jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        java:
          - 17
          - 21
    runs-on: ${{matrix.os}}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{matrix.java}}

      - name: Make mvnw executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: build application
        run: ./mvnw clean verify -DskipTests