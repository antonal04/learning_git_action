name: Build and Publish Docker Image

on:
  push:
    branches:
      - login-feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to Maven Wrapper
        shell: bash
        run: chmod +x mvnw

      - name: Build Maven Project
        run: ./mvnw clean package -DskipTests

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/learning:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/learning:${{ github.sha }} .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/learning:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/learning:${{ github.sha }}